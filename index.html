<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikDown Pro - Descargador de TikTok e Instagram</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 550px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 5px;
            background: linear-gradient(to right, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #ddd;
            margin-bottom: 25px;
        }

        .supported-info {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .badge {
            background: rgba(255, 255, 255, 0.15);
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.8rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 15px 20px;
            border: none;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            font-size: 1rem;
            outline: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        input::placeholder {
            color: #777;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 172, 254, 0.6);
        }

        .helper-text {
            font-size: 0.8rem;
            color: #eee;
            margin-top: 8px;
            line-height: 1.4;
        }

        #loading {
            display: none;
            margin-top: 20px;
            font-size: 1rem;
            font-weight: 600;
            color: #00f2fe;
        }

        #resultBox {
            display: none;
            margin-top: 25px;
            background: white;
            color: #333;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        .download-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            transition: opacity 0.2s;
        }

        .download-btn:hover {
            opacity: 0.9;
        }

        .btn-video {
            background-color: #25D366;
        }

        .btn-audio {
            background-color: #ff3366;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>TikDown Pro</h1>
        <p class="subtitle">Descarga desde TikTok o Instagram con el mismo enlace</p>

        <div class="supported-info">
            <span class="badge">📱 Enlaces de Celular</span>
            <span class="badge">💻 Enlaces de PC</span>
            <span class="badge">🎵 Audio MP3</span>
        </div>

        <div class="input-group">
            <input type="text" id="videoUrl" placeholder="Pega el enlace de TikTok o Instagram aquí...">
            <p class="helper-text">
                Funciona con enlaces normales (<code>https://www...</code>) y enlaces cortos de celular
                (<code>vt.tiktok...</code>, <code>vm.tiktok...</code>).
            </p>
        </div>

        <button type="button" onclick="buscarVideo();">Obtener Descarga</button>

        <div id="loading">Analizando enlace... Por favor espera.</div>

        <div id="resultBox"></div>
    </div>

    <script>
        async function buscarVideo() {
            let urlInput = document.getElementById("videoUrl").value.trim();
            const loadingDiv = document.getElementById("loading");
            const resultBox = document.getElementById("resultBox");

            if (!urlInput) {
                alert("Por favor, pega un enlace válido.");
                return;
            }

            // Corrección ortográfica automática en caliente
            urlInput = urlInput.replace(/tikok\.com/i, "tiktok.com");
            urlInput = urlInput.replace(/http[s]?\s*>?\s*\/?\/?/i, "https://");

            resultBox.style.display = "none";
            loadingDiv.style.display = "block";
            loadingDiv.innerHTML = "Procesando enlace con la nueva API unificada... 🚀";

            // Datos de la API "Social Media Video Downloader (No Watermark)"
            const apiKey = "ce4f3137a6msh147a7c0728f1066p18b384jsn9a92f89e1387";
            const apiHost = "social-media-video-downloader-no-watermark.p.rapidapi.com";
            const apiUrl = `https://${apiHost}/api/v1/video`;

            try {
                // Hacemos una petición POST enviando el enlace en formato JSON
                const respuesta = await fetch(apiUrl, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "x-rapidapi-key": apiKey,
                        "x-rapidapi-host": apiHost
                    },
                    body: JSON.stringify({
                        url: urlInput
                    })
                });

                const data = await respuesta.json();
                console.log("Respuesta de la API:", data);

                loadingDiv.style.display = "none";

                // Extraemos la información devuelta por la API
                // Evaluamos si viene envuelto en un nodo "data" o directamente en la raíz
                const resObj = data.data || data;

                let videoDirectUrl = "";
                let audioDirectUrl = "";
                let tituloVideo = "Multimedia Descargada";
                let thumbnailVideo = "";

                if (resObj) {
                    // Mapeo flexible de propiedades (hd_video, url o video)
                    videoDirectUrl = resObj.hd_video || resObj.video || resObj.url || "";
                    audioDirectUrl = resObj.audio || resObj.music || "";
                    tituloVideo = resObj.title || resObj.description || "Video Procesado con éxito";
                    thumbnailVideo = resObj.thumbnail || resObj.cover || "";
                }

                if (videoDirectUrl) {
                    const esInstagram = urlInput.includes("instagram.com");

                    resultBox.innerHTML = `
                        <div style="margin-bottom: 15px;">
                            ${thumbnailVideo ? `<img src="${thumbnailVideo}" alt="Miniatura" style="max-width: 110px; border-radius: 8px; margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">` : ""}
                            <h3 style="margin: 5px 0; font-size: 15px; color: #333; font-weight: 600;">${tituloVideo}</h3>
                            <p style="margin: 5px 0; color: #666; font-size: 13px;">Plataforma: <strong>${esInstagram ? 'Instagram' : 'TikTok'}</strong></p>
                        </div>
                        
                        <p style="font-weight: bold; margin-bottom: 12px; font-size: 14px; color: #222;">¡Enlaces listos para descargar!</p>
                        
                        <a href="${videoDirectUrl}" target="_blank" download="video.mp4" class="download-btn btn-video">
                            🎥 Descargar Video (Sin Marca de Agua)
                        </a>

                        <a href="${audioDirectUrl || videoDirectUrl}" target="_blank" download="audio.mp3" class="download-btn btn-audio">
                            🎵 Descargar Solo Audio (MP3)
                        </a>
                    `;
                    resultBox.style.display = "block";
                } else {
                    resultBox.innerHTML = `
                        <p style="color: red; margin: 0; font-weight: 600;">No se pudo procesar este enlace.</p>
                        <p style="font-size: 11px; color: #999; margin-top: 5px;">Detalles técnicos: ${JSON.stringify(data)}</p>
                    `;
                    resultBox.style.display = "block";
                }

            } catch (error) {
                console.error("Error en la petición:", error);
                loadingDiv.style.display = "none";
                resultBox.innerHTML = `<p style="color: red; margin: 0;">Hubo un error al conectar con el servidor de la API. Inténtalo de nuevo.</p>`;
                resultBox.style.display = "block";
            }
        }
    </script>
</body>

</html>
