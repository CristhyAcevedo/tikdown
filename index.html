<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InstaDown & TikDown - Descargador Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c1b, #24243e, #300030);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 30px 20px;
        }

        .main-wrapper {
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .card {
            padding: 35px 25px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-3px);
        }

        /* --- ESTILO SECCIÓN INSTAGRAM --- */
        .instagram-card {
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .instagram-title {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 5px;
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .instagram-card input {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 50px;
            background: #fff;
            color: #333;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
            text-align: center;
        }

        .instagram-card input:focus {
            border-color: #dc2743;
        }

        .instagram-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(45deg, #f09433, #dc2743, #bc1888);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(220, 39, 67, 0.3);
            transition: opacity 0.2s;
        }

        /* --- ESTILO SECCIÓN TIKTOK --- */
        .tiktok-card {
            background: rgba(20, 20, 25, 0.95);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tiktok-title {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 5px;
            background: linear-gradient(to right, #00f2fe, #4facfe, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tiktok-card input {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid #333;
            border-radius: 50px;
            background: #111;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
            text-align: center;
        }

        .tiktok-card input:focus {
            border-color: #00f2fe;
        }

        .tiktok-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
            transition: opacity 0.2s;
        }

        .card-btn:hover {
            opacity: 0.9;
        }

        /* --- ESTILOS COMUNES --- */
        .subtitle {
            font-size: 0.85rem;
            opacity: 0.8;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .helper-text {
            font-size: 0.75rem;
            opacity: 0.6;
            margin-top: 8px;
            line-height: 1.4;
        }

        .loading-text {
            display: none;
            margin-top: 15px;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .result-box {
            display: none;
            margin-top: 20px;
            background: #fafafa;
            color: #333;
            padding: 20px;
            border-radius: 18px;
            border: 1px solid #eee;
            text-align: center;
        }

        .tiktok-card .result-box {
            background: #18181c;
            color: #fff;
            border: 1px solid #2d2d35;
        }

        .download-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.95rem;
        }

        /* Botones de descarga Instagram */
        .ig-dl-video {
            background: linear-gradient(45deg, #dc2743, #cc2366);
        }

        .ig-dl-audio {
            background-color: #333;
        }

        /* Botones de descarga TikTok */
        .tt-dl-video {
            background: linear-gradient(45deg, #25D366, #128C7E);
        }

        .tt-dl-audio {
            background: #00f2fe;
            color: #111;
        }
    </style>
</head>

<body>

    <div class="main-wrapper">

        <div class="card instagram-card">
            <h1 class="instagram-title">InstaDown</h1>
            <p class="subtitle">Descarga Reels, Fotos y Videos de Instagram</p>

            <div class="input-group">
                <input type="text" id="igUrl" placeholder="Pega el enlace de Instagram aquí...">
                <p class="helper-text">Soporta enlaces de la app del celular y de PC</p>
            </div>

            <button type="button" class="instagram-btn card-btn" onclick="descargarInstagram();">Descargar de
                Instagram</button>
            <div id="igLoading" class="loading-text" style="color: #dc2743;">Limpiando enlace de celular... 🧹📱</div>
            <div id="igResult" class="result-box"></div>
        </div>

        <div class="card tiktok-card">
            <h1 class="tiktok-title">TikDown</h1>
            <p class="subtitle">Descarga Videos de TikTok sin Marca de Agua</p>

            <div class="input-group">
                <input type="text" id="ttUrl" placeholder="Pega el enlace de TikTok aquí...">
                <p class="helper-text">Soporta enlaces móviles (vt.tiktok / vm.tiktok) y de PC</p>
            </div>

            <button type="button" class="tiktok-btn card-btn" onclick="descargarTikTok();">Descargar de TikTok</button>
            <div id="ttLoading" class="loading-text" style="color: #00f2fe;">Procesando enlace de celular... 🚀📱</div>
            <div id="ttResult" class="result-box"></div>
        </div>

    </div>

    <script>
        const apiKeyShared = "ce4f3137a6msh147a7c0728f1066p18b384jsn9a92f89e1387";

        // ==================== INSTAGRAM FUNCIONALIDAD ====================
        async function descargarInstagram() {
            let urlInput = document.getElementById("igUrl").value.trim();
            const loadingDiv = document.getElementById("igLoading");
            const resultBox = document.getElementById("igResult");

            if (!urlInput) {
                alert("Por favor, pega un enlace de Instagram.");
                return;
            }

            if (!urlInput.includes("instagram.com")) {
                alert("El enlace no corresponde a Instagram.");
                return;
            }

            resultBox.style.display = "none";
            loadingDiv.style.display = "block";
            loadingDiv.innerHTML = "Limpiando enlace... 🧹";

            if (urlInput.includes("?")) {
                urlInput = urlInput.split("?")[0];
            }

            loadingDiv.innerHTML = "Extrayendo multimedia de Instagram... 📥";

            const apiHost = "instagram-downloader-download-instagram-videos-stories1.p.rapidapi.com";
            const apiUrl = `https://${apiHost}/get-info-rapidapi?url=${encodeURIComponent(urlInput)}`;

            try {
                const respuesta = await fetch(apiUrl, {
                    method: "GET",
                    headers: {
                        "x-rapidapi-key": apiKeyShared,
                        "x-rapidapi-host": apiHost
                    }
                });

                const data = await respuesta.json();
                loadingDiv.style.display = "none";

                let videoDirectUrl = data.url || data.download_url || data.media || (data.links && data.links[0]?.link) || "";
                let audioDirectUrl = data.audio || "";
                let tituloVideo = data.title || "Publicación de Instagram";
                let thumbnailVideo = data.thumbnail || data.cover || "";

                if (videoDirectUrl) {
                    resultBox.innerHTML = `
                        <div style="margin-bottom: 15px;">
                            ${thumbnailVideo ? `<img src="${thumbnailVideo}" alt="Cover" style="max-width: 110px; border-radius: 12px; margin-bottom: 8px;">` : ""}
                            <h3 style="font-size: 14px; font-weight: 600; line-height: 1.4; color: #333;">${tituloVideo}</h3>
                        </div>
                        <a href="${videoDirectUrl}" target="_blank" download="instagram_video.mp4" class="download-btn ig-dl-video">
                            🎥 Descargar Video
                        </a>
                        <a href="${audioDirectUrl || videoDirectUrl}" target="_blank" download="instagram_audio.mp3" class="download-btn ig-dl-audio">
                            🎵 Descargar MP3
                        </a>
                    `;
                    resultBox.style.display = "block";
                } else {
                    resultBox.innerHTML = `<p style="color: red; font-size: 13px;">No se pudo obtener el archivo de descarga.</p>`;
                    resultBox.style.display = "block";
                }
            } catch (error) {
                console.error(error);
                loadingDiv.style.display = "none";
                resultBox.innerHTML = `<p style="color: red; font-size: 13px;">Error al conectar con la API de Instagram.</p>`;
                resultBox.style.display = "block";
            }
        }


        // ==================== TIKTOK FUNCIONALIDAD ====================
        async function descargarTikTok() {
            let urlInput = document.getElementById("ttUrl").value.trim();
            const loadingDiv = document.getElementById("ttLoading");
            const resultBox = document.getElementById("ttResult");

            if (!urlInput) {
                alert("Por favor, pega un enlace de TikTok.");
                return;
            }

            // 1. Limpieza ortográfica y formato inicial
            urlInput = urlInput.replace(/tikok\.com/i, "tiktok.com");
            if (!urlInput.startsWith("http://") && !urlInput.startsWith("https://")) {
                urlInput = "https://" + urlInput;
            }

            if (!urlInput.includes("tiktok.com")) {
                alert("El enlace no corresponde a TikTok.");
                return;
            }

            resultBox.style.display = "none";
            loadingDiv.style.display = "block";
            loadingDiv.innerHTML = "Verificando enlace de celular... 📱";

            // 2. RESOLVER ENLACE MÓVIL SI ES vt.tiktok / vm.tiktok / t.tiktok
            if (urlInput.includes("vt.tiktok.com") || urlInput.includes("vm.tiktok.com") || urlInput.includes("tiktok.com/t/")) {
                loadingDiv.innerHTML = "Traduciendo enlace de celular para la API... 📱🧹";
                try {
                    const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(urlInput)}`);
                    if (response.ok) {
                        const resJSON = await response.json();
                        if (resJSON.contents) {
                            // Buscar la URL canónica (larga) dentro del código devuelto
                            const matchUrl = resJSON.contents.match(/"(https:\/\/www\.tiktok\.com\/@[^\/]+\/video\/[0-9]+)"/i) ||
                                resJSON.contents.match(/<link[^>]+rel="canonical"[^>]+href="([^"]+)"/i);
                            if (matchUrl && matchUrl[1]) {
                                urlInput = matchUrl[1];
                                console.log("Enlace móvil resuelto con éxito:", urlInput);
                            }
                        }
                    }
                } catch (err) {
                    console.warn("No se pudo traducir la URL corta, se enviará la original.", err);
                }
            }

            // 3. Quitar parámetros de rastreo innecesarios que causan fallos en la API (como ?_r=1, ?_t=..., etc.)
            if (urlInput.includes("?")) {
                urlInput = urlInput.split("?")[0];
            }

            loadingDiv.innerHTML = "Extrayendo video sin marca de agua... 📥";

            const apiHost = "tiktok-video-no-watermark2.p.rapidapi.com";
            const apiUrl = `https://${apiHost}/?url=${encodeURIComponent(urlInput)}&hd=1`;

            try {
                const respuesta = await fetch(apiUrl, {
                    method: "GET",
                    headers: {
                        "x-rapidapi-key": apiKeyShared,
                        "x-rapidapi-host": apiHost
                    }
                });

                const data = await respuesta.json();
                console.log("Respuesta obtenida de la API:", data);

                loadingDiv.style.display = "none";

                let videoDirectUrl = "";
                let audioDirectUrl = "";
                let tituloVideo = "Multimedia Encontrada";
                let thumbnailVideo = "";

                const resObj = data.data || data;
                if (resObj) {
                    videoDirectUrl = resObj.hdplay || resObj.play || resObj.wmplay || resObj.video || "";
                    audioDirectUrl = resObj.music || resObj.audio || "";
                    tituloVideo = resObj.title || resObj.description || "Video de TikTok";
                    thumbnailVideo = resObj.cover || resObj.origin_cover || "";
                }

                if (videoDirectUrl) {
                    resultBox.innerHTML = `
                        <div style="margin-bottom: 20px;">
                            ${thumbnailVideo ? `<img src="${thumbnailVideo}" alt="Miniatura" style="max-width: 120px; border-radius: 12px; margin-bottom: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);">` : ""}
                            <h3 style="font-size: 15px; font-weight: 600; line-height: 1.4; color: #fff; margin-bottom: 5px;">${tituloVideo}</h3>
                            <p style="font-size: 12px; color: #aaa;">Plataforma: <strong style="color: #00f2fe;">TikTok</strong></p>
                        </div>
                        
                        <a href="${videoDirectUrl}" target="_blank" download="tiktok_video.mp4" class="download-btn tt-dl-video">
                            🎥 Descargar Video Completo (Sin Marca)
                        </a>

                        <a href="${audioDirectUrl || videoDirectUrl}" target="_blank" download="tiktok_audio.mp3" class="download-btn tt-dl-audio">
                            🎵 Descargar Música (MP3)
                        </a>
                    `;
                    resultBox.style.display = "block";
                } else {
                    resultBox.innerHTML = `
                        <p style="color: #ff007f; font-weight: 600; font-size: 14px;">La API no devolvió enlaces directos.</p>
                        <p style="font-size: 11px; color: #888; margin-top: 8px; text-align: left; background: #222; padding: 10px; border-radius: 8px; overflow-x: auto; white-space: pre-wrap;">
                            Respuesta del servidor: ${JSON.stringify(data)}
                        </p>
                    `;
                    resultBox.style.display = "block";
                }

            } catch (error) {
                console.error("Error al procesar descarga:", error);
                loadingDiv.style.display = "none";
                resultBox.innerHTML = `<p style="color: #ff007f; font-weight: 600;">Hubo un error al conectar con el servidor. Asegúrate de estar suscrita a la API de TikTok.</p>`;
                resultBox.style.display = "block";
            }
        }
    </script>
</body>

</html>
